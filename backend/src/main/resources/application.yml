server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: asistencia-docente
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/asistencia}
    username: ${DATABASE_USER:asistencia}
    password: ${DATABASE_PASSWORD:asistencia-local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  policy:
    max-accuracy-meters: ${MAX_ACCURACY_METERS:50}
    max-age-seconds: ${MAX_AGE_SECONDS:120}
    early-minutes: ${EARLY_MINUTES:15}
    late-minutes: ${LATE_MINUTES:15}
    time-zone: ${TIME_ZONE:America/Mexico_City}
